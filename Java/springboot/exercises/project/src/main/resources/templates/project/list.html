<html lang = "en" xmlns="http://www.thyleaf.com">
    <head>
        <title>List<title>
    </head>

    <body>
        <h1>List</h1>
        <table border = "1">
            <tr th:each = "a : ${project}">
                <td th:text = "${a.id}"></td>
                <td th:text = "${a.name}"></td>
                <td>
                    <a th:href = "@{/album/{id}/edit(id = ${a.id})}">update</a>
                    <a th:href = "@{/album/{id}/delete(id = ${a.id})}">delete</a>
                </td>
            </tr>
        </table>

        <br>
        <a th:href = "@{/album/new}">Add new project</a>
    </body>
</html>
